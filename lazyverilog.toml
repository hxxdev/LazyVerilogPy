[design]
vcode = "tests/demo/vcode.f"
define = ["RTL_SIM"]   # preprocessor defines passed to pyslang for AST parsing

[rtltree]
show_instance_name = true   # show "cpu (u_cpu)" instead of just "cpu"
show_file = true             # show "[rtl/cpu.sv]" after module name

[formatter]
indent_size = 4
keyword_case = "lower"          # "lower" | "upper" | "preserve"
max_line_length = 120
wrap_spaces = 4
wrap_end_else_clauses = false
compact_indexing_and_selections = true
blank_lines_between_items = 1
default_indent_level_inside_module_block = 0
align_assign_operators = true
tab_align = true
# align_assign_gap = 20
align_port_declarations = true
port_declaration_section2_column = 0  # 0 = natural spacing; non-zero = absolute 1-based column
port_declaration_section3_column = 39
port_declaration_section4_column = 0
port_declaration_section5_column = 0
align_instance_ports = true
instance_port_indent_level = 1 # indent levels for port lines relative to module instantiation
instance_port_spacing_before_paren = 10 # spaces between port name and (
instance_port_spacing_inside_paren = 10 # spaces between signal and )
align_variable_declarations = true
var_declaration_section2_column = 0  # 0 = natural spacing; non-zero = absolute 1-based column
var_declaration_section3_column = 40
var_declaration_section4_column = 0

[autofunc]
use_named_arguments = true

[autotask]
use_named_arguments = true
