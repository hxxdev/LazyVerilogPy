[design]
vcode = "demo/vcode.f"
define = ["RTL_SIM"]   # preprocessor defines passed to pyslang for AST parsing

[lint]
enable = true   # global kill-switch; false disables all lint rules

[lint.naming]
enable = true
severity = "warning"          # "warning" | "error" | "hint"
module_pattern = "^[a-z_]+$" # regex; empty = skip
input_port_pattern = "^i_.*$"  # regex; empty = skip
output_port_pattern = "^o_.*$" # regex; empty = skip
signal_pattern = "^(?!q_).*"           # regex for internal logic/wire/var; empty = skip
interface_pattern = ".*_intf$"        # regex for interface names; empty = skip
struct_pattern = ".*_t$"           # regex for struct names; empty = skip
union_pattern = ".*_u$"            # regex for union names; empty = skip
enum_pattern = ""             # regex for enum names; empty = skip
parameter_pattern = "^W_.*$"        # regex for parameter names; empty = skip
localparam_pattern = "^LP_.*$"       # regex for localparam names; empty = skip
register_pattern = "^r_.*$"
check_module_filename = false # check that module name matches filename
check_package_filename = false # check that package name matches filename

[lint.module]
enable = true
severity = "warning"          # "warning" | "error" | "hint"
one_module_per_file = false   # check that at most one module is declared per file
module_instantiation_style = ""  # "positional", "named", or "both"

[lint.statement]
enable = true
severity = "warning"          # "warning" | "error" | "hint"
no_raw_always = false         # check that there are no occurrences of raw always
blocking_nonblocking_assignments = false  # check blocking vs non-blocking assignments
latch_inference_detection = false         # check for latch inference
case_missing_default = false              # check that default case-item is always defined
explicit_begin = false              # check that Verilog begin directive follows all applicable statements

[lint.function]
enable = true
severity = "warning"          # "warning" | "error" | "hint"
functions_automatic = false   # functions should be automatic type
function_call_style = ""      # "positional", "named", or "both"
function_return_type = ""     # comma-separated list of allowed return types or empty for all
explicit_function_lifetime = false  # check that functions have explicit lifetime (static/automatic)
explicit_task_lifetime = false    # check that tasks have explicit lifetime (static/automatic)

[lint.design]
enable = true
severity = "warning"          # "warning" | "error" | "hint"
max_file_size = 0             # file size limit in bytes (0 = no limit)

[rtltree]
show_instance_name = true   # show "cpu (u_cpu)" instead of just "cpu"
show_file = true             # show "[rtl/cpu.sv]" after module name

[formatter]
safe_mode = true # verify no non-whitespace content changed after format
indent_size = 4
keyword_case = "lower"          # "lower" | "upper" | "preserve"
compact_indexing_and_selections = true
blank_lines_between_items = 1
default_indent_level_inside_module_block = 0
tab_align = true
align_punctuation = true
enable_format_on_save = true

[formatter.statement]
align = true              # align = and <= operators in consecutive assignments
align_adaptive = false
lhs_min_width = 6           # minimum width of the LHS column before the operator
wrap_end_else_clauses = true

[formatter.port_declaration]
align = true
section1_min_width = 6
section2_min_width = 20
section3_min_width = 20
section4_min_width = 20
section5_min_width = 20

[formatter.var_declaration]
align = true
section1_min_width = 20
section2_min_width = 20
section3_min_width = 20
section4_min_width = 16

[formatter.port]
non_ansi_port_per_line_enabled = false
non_ansi_port_per_line = 3
non_ansi_port_max_line_length_enabled = true
non_ansi_port_max_line_length = 18

[formatter.instance]
align = true
port_indent_level = 1           # indent levels for port lines relative to instantiation
port_spacing_before_paren = 10  # spaces between port name and (
port_spacing_inside_paren = 10  # spaces between signal and )

[autofunc]
use_named_arguments = true

[autoarg]
indent_size = 4
on_save = true

[autoinst]
indent_size = 4

[autowire]
group_by_instance = false
sort_by_name = true
